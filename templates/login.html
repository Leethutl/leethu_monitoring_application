{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
<section class="login-panel">
  <h1>Sign in</h1>
  <p class="lede">Single admin access for the Leethu demo monitor.</p>

  {% if error %}
  <p class="form-error" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" action="{{ url_for('login') }}" class="stack-form" autocomplete="off">
    <label>
      Username
      <input type="text" name="username" required autofocus value="admin">
    </label>
    <label>
      Password
      <input type="password" name="password" required>
    </label>
    <button type="submit" class="btn">Sign in</button>
  </form>
</section>
{% endblock %}
